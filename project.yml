name: Claudifications
options:
  bundleIdPrefix: net.curtisg
  deploymentTarget:
    macOS: "14.0"
  defaultConfig: Debug

targets:
  Claudifications:
    type: application
    platform: macOS
    sources:
      - path: Claudifications
      - path: hooks/fleet-status.sh
        type: resource
      - path: hooks/usage-statusline.py
        type: resource
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.curtisg.claudifications
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Release builds override both from the git tag; see .github/workflows.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: minimal
        INFOPLIST_FILE: Claudifications/Info.plist
        CODE_SIGN_ENTITLEMENTS: Claudifications/Claudifications.entitlements
        # Ad-hoc by default so a clone builds and runs without any Apple
        # account. The release workflow re-signs the finished bundle with the
        # Developer ID identity; nothing here needs a team.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        # On for local builds too, so an entitlement the hardened runtime
        # rejects fails on your machine rather than in a notarized release.
        ENABLE_HARDENED_RUNTIME: YES
      debug:
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        DEBUG_INFORMATION_FORMAT: dwarf
      release:
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
